name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Bun checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        # Match production: check-node-runtime.mjs requires >= 24.15
        # (TransformStream race fix), the Dockerfile runs node:24.18.0.
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        run: bunx next build

      - name: Audit dependencies
        # Blocking: a known-vulnerable dependency must fail the build, not
        # scroll past in logs nobody reads.
        run: bun audit

      - name: Semgrep
        # Blocking: static-analysis findings must gate merges.
        run: |
          python -m pip install --upgrade semgrep
          semgrep --config auto --error
