name: Immutable runner validation

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Full 40-character commit from main to package
        required: true
        type: string

permissions:
  contents: read

jobs:
  artifact:
    name: Build and smoke linux/amd64 runner
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_COMMIT: ${{ inputs.source_commit }}

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_commit }}

      - name: Verify immutable source identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          git merge-base --is-ancestor "$SOURCE_COMMIT" origin/main
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Create validation-only build secret
        shell: bash
        run: |
          set -euo pipefail
          temporary_key="$(openssl rand -base64 32)"
          echo "::add-mask::$temporary_key"
          printf 'NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=%s\n' "$temporary_key" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install smoke dependencies
        run: bun install --frozen-lockfile --os=linux --cpu=x64

      # The attested image is a manifest list. Enable Docker's containerd image
      # store so the docker exporter can load the exact image used by smoke.
      - name: Setup Docker with containerd image store
        uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1 # v5.4.0
        with:
          version: v29.2.1
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: docker-container

      - name: Build one immutable runner
        run: |
          scripts/build-immutable-runner.sh \
            --commit "$SOURCE_COMMIT" \
            --output-dir runner-artifacts \
            --tag "open-launch:$SOURCE_COMMIT" \
            --validation-only

      - name: Smoke final runner image
        run: scripts/smoke-runner-image.sh "open-launch:$SOURCE_COMMIT"

      - name: Upload verified artifact bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: open-launch-runner-${{ inputs.source_commit }}
          path: runner-artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
